; PlatformIO project - Triangular rover (ESP32-S3 WROOM devkit)
;
; Read the label on your module (e.g. "ESP32-S3-WROOM-1-N16R8"):
;   N8R8 / N16R8  -> octal PSRAM -> memory_type = qio_opi   (set below)
;   N8R2 / N4R2   -> quad PSRAM  -> memory_type = qio_qspi
;   no "R" at all -> no PSRAM    -> delete the memory_type line AND -DBOARD_HAS_PSRAM
; A wrong value can make the board fail to boot (boot loop).

[env:esp32-s3]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
; Use the USB port labelled "UART" on the devkit for upload + serial monitor.
